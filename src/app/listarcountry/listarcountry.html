<h1 class="text-center text-fuchsia-700">LISTAR PAIS</h1>
<div class="mx-10 overflow-x-auto max-w-full shadow-md rounded-xl my-4">
<table class="w-full whitespace-nowrap text-center [&_td]:p-2 [&_th]:p-2">
    <thead>
        <tr class="bg-fuchsia-800 text-white [&_th]:border [&_th]:border-pink-950">
        <th >Id Pais</th>
        <th >Pais</th>
        <th >Ultima Actualizacion</th>
        <th >Eliminar</th>
        <th >Actualizar</th>
        

        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let country of countrys"
        class="[&_td]:border [&_td]:border-y-gray-200 [&_td]:border-x-gray-400">
        <td  >{{country.country_id}}</td>
        <td  >{{country.country}}</td>
        <td  >{{country.last_update}}</td>
        <td  ><button (click)="eliminarr(country.country_id)">Eliminar</button></td>
        <td  class="bg-red-300"><button [routerLink]="['/actualizarcountry', country.country_id]">Actualizar</button></td>
        </tr>
    </tbody>
</table>
</div>
