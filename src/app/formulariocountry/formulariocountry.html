<div class="max-w-md mx-auto mt-8 p-6 bg-white border border-pink-200 rounded-2xl shadow-sm">
<p class="text-2xl text-fuchsia-700 text-center font-medium">Formulario Country</p>
<p class="text-center text-pink-300 text-sm mt-1">Diligencia la informacion requerida</p>
<hr class="border-pink-100 my-6">
<form (ngSubmit)="guardarcountry()">
    <label class="block text-fuchsia-800 font-medium mb-2">País</label>
    <input type="text"   [(ngModel)]="nuevaCountry.country"      name="country"  placeholder="Pais" class="w-full border border-pink-200 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:border-fuchsia-500">    
    <div class="mt-6">
    <button class="w-full bg-fuchsia-700 text-white py-3 rounded-xl" type="submit">Guardar</button>
    </div>
</form>
</div>
