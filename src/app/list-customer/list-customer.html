<h1 class="text-center">Listar cliente</h1>
<div class="mx-10 overflow-x-auto max-w-full shadow-md rounded-xl my-4">
    <table class="w-full whitespace-nowrap text-center [&_td]:p-2 [&_th]:p-2">
            <thead >
                <tr class="bg-pink-800 text-white [&_th]:border [&_th]:border-pink-950">
                    <th>Id cliente</th>
                    <th>Almacén</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Correo</th>
                    <th>Id de Dirección</th>
                    <th>Activo</th>
                    <th>Editar</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let i of NewCustomer" class="[&_td]:border [&_td]:border-y-gray-200 [&_td]:border-x-gray-400">
                    <td>{{i.customer_id}}</td>
                    <td>{{i.store_id}}</td>
                    <td>{{i.first_name}}</td>
                    <td>{{i.last_name}}</td>
                    <td>{{i.email}}</td>
                    <td>{{i.address_id}}</td>
                    <td>{{i.active}}</td>
                    <td class="bg-amber-100"><button [routerLink]="['/updatecustomer', i.customer_id]">Editar</button></td>
                    <td class="bg-red-300"><button (click)="eliminarCustomer(i.customer_id)">Eliminar</button></td>
                </tr>
            </tbody>
    </table>
</div>


<div class="max-w-xs mx-auto my-6 p-4 bg-white shadow-md rounded-xl flex flex-col items-center">
  <h3 class="text-sm font-bold text-slate-800 mb-2">Estado de Clientes (Activos vs Inactivos)</h3>
  <canvas id="customerPieChart"></canvas>
</div>
